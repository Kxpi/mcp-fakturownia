services:
  mcp:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?MCP_PUBLIC_URL is required}
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:?OAUTH_JWT_SECRET is required}
      OAUTH_CONSENT_PASSWORD: ${OAUTH_CONSENT_PASSWORD:?OAUTH_CONSENT_PASSWORD is required}
      MCP_ACCESS_API_KEY: ${MCP_ACCESS_API_KEY:-}
    restart: unless-stopped
    # ports:
    #   - "3000:3000"  # uncomment for local debugging without tunnel

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - mcp
    restart: unless-stopped
